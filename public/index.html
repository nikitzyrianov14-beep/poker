<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LIPOKER</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #232120;
            color: #e5e5e5;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        /* Top Bar */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
        }
        .brand { font-size: 22px; font-weight: 800; letter-spacing: 1px; color: #d4d4d4; }
        .blinds { font-size: 13px; color: #999; margin-top: 2px; }
        .top-btn {
            background: #3a3735;
            color: #e0e0e0;
            border: 1px solid #4e4a47;
            padding: 7px 14px;
            border-radius: 5px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-left: 8px;
        }
        .top-btn:hover { background: #4a4643; }

        /* Left Color Picker */
        .color-picker {
            position: fixed;
            left: 18px;
            top: 85px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 5;
        }
        .swatch {
            width: 26px; height: 26px; border-radius: 50%;
            border: 3px solid #555; cursor: pointer;
        }

        /* Poker Table Container */
        .arena {
            position: relative;
            width: 820px;
            height: 440px;
            margin: 25px auto 0;
        }
        .felt {
            position: absolute;
            inset: 55px 95px;
            background: #0d7a22;
            border: 14px solid #3c2f26;
            border-radius: 180px;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.5), 0 12px 30px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }
        .pot-tag {
            background: rgba(0,0,0,0.45);
            padding: 4px 14px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            color: #ffd166;
            margin-bottom: 10px;
        }
        .copy-btn {
            background: rgba(60, 60, 60, 0.75);
            color: #fff;
            border: 1px solid #777;
            padding: 9px 18px;
            border-radius: 5px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .copy-btn:hover { background: rgba(90, 90, 90, 0.9); }

        .board-cards { display: flex; gap: 6px; min-height: 76px; align-items: center; }
        .card {
            width: 50px; height: 72px; background: #fff; border-radius: 6px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-weight: 800; font-size: 20px; box-shadow: 0 3px 8px rgba(0,0,0,0.5);
        }
        .red { color: #d90429; }
        .black { color: #111; }

        /* 8 Seats Around Table */
        .seat {
            position: absolute;
            width: 130px;
            text-align: center;
            transform: translate(-50%, -50%);
        }
        .s0 { top: 88%; left: 50%; }
        .s1 { top: 84%; left: 22%; }
        .s2 { top: 50%; left: 7%; }
        .s3 { top: 16%; left: 22%; }
        .s4 { top: 16%; left: 78%; }
        .s5 { top: 50%; left: 93%; }
        .s6 { top: 84%; left: 78%; }
        .s7 { top: 10%; left: 50%; }

        .open-btn {
            background: rgba(30, 30, 30, 0.7);
            color: #4ade80;
            border: 1px solid #3f3f46;
            padding: 6px 18px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        .open-btn:hover { background: #27272a; }

        .player-plate {
            background: #2b2927;
            border: 2px solid #524e4b;
            border-radius: 6px;
            padding: 6px 10px;
            cursor: pointer;
            position: relative;
        }
        .player-plate.turn { border-color: #facc15; box-shadow: 0 0 12px #facc15; }
        .player-plate.folded { opacity: 0.45; }
        .p-name { font-size: 12px; font-weight: 700; color: #fff; }
        .p-stack { font-size: 12px; color: #a3e635; font-weight: 600; }
        .p-bet { font-size: 11px; color: #fbbf24; margin-top: 2px; }
        .dealer-chip {
            position: absolute; top: -8px; right: -8px;
            background: #fff; color: #000; font-weight: 900; font-size: 11px;
            width: 20px; height: 20px; line-height: 20px; border-radius: 50%; border: 2px solid #000;
        }
        .mini-cards { display: flex; justify-content: center; gap: 4px; margin-bottom: 4px; }
        .mini-card {
            width: 34px; height: 48px; background: #fff; border-radius: 4px;
            font-size: 14px; font-weight: 800; line-height: 48px; box-shadow: 0 2px 5px rgba(0,0,0,0.6);
        }

        /* Bottom Action Panel */
        .action-bar {
            position: fixed;
            bottom: 48px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(25,25,25,0.9);
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid #444;
        }
        .combo-pill { color: #facc15; font-size: 13px; font-weight: 700; margin-right: 10px; }
        .act-btn { padding: 8px 16px; border: none; border-radius: 5px; font-weight: 700; cursor: pointer; font-size: 13px; }
        .btn-call { background: #16a34a; color: #fff; }
        .btn-raise { background: #eab308; color: #000; }
        .btn-fold { background: #dc2626; color: #fff; }
        .raise-inp { width: 75px; padding: 7px; border-radius: 4px; border: 1px solid #555; background: #18181b; color: #fff; font-weight: bold; }

        /* Bottom Chat & Log Drawer */
        .bottom-drawer {
            position: fixed; bottom: 0; left: 16px; width: 360px;
            background: #2c2a29; border: 1px solid #444; border-bottom: none;
            border-radius: 6px 6px 0 0; z-index: 10;
        }
        .drawer-tabs { display: flex; border-bottom: 1px solid #444; }
        .d-tab { flex: 1; padding: 7px; text-align: center; font-size: 12px; font-weight: 700; cursor: pointer; color: #aaa; }
        .d-tab.active { color: #fff; background: #3a3735; }
        .drawer-body { display: none; height: 150px; flex-direction: column; padding: 8px; }
        .drawer-body.open { display: flex; }
        .msg-list { flex: 1; overflow-y: auto; font-size: 12px; text-align: left; color: #d4d4d4; }
        .chat-input-row { display: flex; gap: 5px; margin-top: 6px; }
        .chat-input-row input { flex: 1; background: #1e1d1c; border: 1px solid #555; color: #fff; padding: 5px 8px; border-radius: 4px; font-size: 12px; }

        /* Brown LiPoker Modals */
        .modal-bg {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65);
            z-index: 50; justify-content: center; align-items: center;
        }
        .brown-modal {
            background: #5c3d24; border: 2px solid #7c5332; border-radius: 6px;
            width: 480px; max-width: 92vw; padding: 20px; color: #f5efe6;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8); position: relative;
        }
        .brown-modal h2 { margin: 0 0 14px; text-align: center; font-size: 20px; }
        .close-x { position: absolute; top: 12px; right: 14px; cursor: pointer; font-weight: bold; color: #d6c3b3; }

        /* Hand Rankings Rows */
        .hr-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; font-size: 14px; font-weight: 700; }
        .hr-cards { display: flex; gap: 4px; }
        .hr-c {
            width: 28px; height: 38px; background: #fff; border-radius: 4px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 800; line-height: 1.1;
        }
        .hr-empty { width: 28px; height: 38px; border: 1px dashed #a88b73; border-radius: 4px; }

        /* Leaderboard Table */
        .lb-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 16px; }
        .lb-table th { padding: 8px; border-bottom: 1px solid #7c5332; color: #e6d5c3; }
        .lb-table td { padding: 8px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .lb-me { background: rgba(255,255,255,0.12); font-weight: bold; }
        .pos-green { color: #4ade80; font-weight: bold; }
        .neg-red { color: #f87171; font-weight: bold; }
        .brown-btn {
            background: #7c5332; color: #fff; border: 1px solid #9c6b43;
            padding: 9px 18px; border-radius: 4px; font-weight: 700; cursor: pointer; display: block; margin: 0 auto;
        }

        /* Buy Chips Modal */
        .stack-row { display: flex; justify-content: space-between; align-items: center; margin: 12px 0; font-size: 14px; font-weight: 600; }
        .stack-inp { background: #15803d; border: 1px solid #22c55e; color: #fff; padding: 7px 10px; border-radius: 4px; width: 120px; font-weight: bold; text-align: right; }
        .buy-submit { width: 100%; background: #16a34a; color: #fff; border: none; padding: 11px; font-weight: 800; border-radius: 4px; cursor: pointer; margin-top: 12px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="topbar">
        <div>
            <div class="brand">LIPOKER</div>
            <div class="blinds">Blinds: $1.25 / $2.50</div>
        </div>
        <div>
            <button class="top-btn" onclick="openModal('lbModal')">🏆 LEADERBOARD</button>
