<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LIPOKER</title>
<style>
* { box-sizing: border-box; }
body { font-family: 'Segoe UI', sans-serif; background: #232120; color: #e5e5e5; margin: 0; height: 100vh; overflow: hidden; user-select: none; }
.topbar { display: flex; justify-content: space-between; align-items: center; padding: 10px 24px; }
.brand { font-size: 24px; font-weight: 800; letter-spacing: 1px; color: #d4d4d4; }
.blinds { font-size: 13px; color: #999; margin-top: 2px; }
.top-btn { background: #3a3735; color: #e0e0e0; border: 1px solid #4e4a47; padding: 8px 15px; border-radius: 5px; font-size: 13px; font-weight: 600; cursor: pointer; margin-left: 8px; }
.top-btn:hover { background: #4a4643; }
.color-picker { position: fixed; left: 18px; top: 85px; display: flex; flex-direction: column; gap: 12px; z-index: 5; }
.swatch { width: 28px; height: 28px; border-radius: 50%; border: 3px solid #555; cursor: pointer; }
.arena { position: relative; width: 1020px; height: 530px; margin: 5px auto 0; }
.felt { position: absolute; inset: 60px 100px; background: #0d7a22; border: 16px solid #3c2f26; border-radius: 210px; box-shadow: inset 0 0 50px rgba(0,0,0,0.55), 0 14px 35px rgba(0,0,0,0.65); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: background 0.3s; }
.pot-tag { background: rgba(0,0,0,0.5); padding: 6px 18px; border-radius: 5px; font-size: 16px; font-weight: bold; color: #ffd166; margin-bottom: 12px; }
.copy-btn { background: rgba(60,60,60,0.75); color: #fff; border: 1px solid #777; padding: 10px 20px; border-radius: 5px; font-size: 13px; font-weight: bold; cursor: pointer; margin-bottom: 12px; }
.copy-btn:hover { background: rgba(90,90,90,0.9); }
.board-cards { display: flex; gap: 8px; min-height: 86px; align-items: center; }
.card { width: 58px; height: 84px; background: #fff; border-radius: 7px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: 800; font-size: 23px; box-shadow: 0 4px 10px rgba(0,0,0,0.55); }
.red { color: #d90429; }
.black { color: #111; }
.seat { position: absolute; width: 150px; text-align: center; transform: translate(-50%, -50%); }
.s0 { top: 88%; left: 50%; } .s1 { top: 84%; left: 21%; } .s2 { top: 50%; left: 6%; } .s3 { top: 15%; left: 21%; }
.s4 { top: 15%; left: 79%; } .s5 { top: 50%; left: 94%; } .s6 { top: 84%; left: 79%; } .s7 { top: 9%; left: 50%; }
.open-btn { background: rgba(30,30,30,0.75); color: #4ade80; border: 1px solid #3f3f46; padding: 8px 22px; border-radius: 5px; font-size: 13px; font-weight: 700; cursor: pointer; }
.open-btn:hover { background: #27272a; }
.plate-wrap { position: relative; padding: 3px; border-radius: 9px; background: #524e4b; transition: box-shadow 0.2s; }
.plate-wrap.turn { box-shadow: 0 0 16px rgba(250, 204, 21, 0.55); }
.player-plate { background: #2b2927; border-radius: 6px; padding: 7px 11px; cursor: pointer; position: relative; }
.player-plate.folded { opacity: 0.45; }
.p-name { font-size: 13px; font-weight: 700; color: #fff; }
.p-stack { font-size: 13px; color: #a3e635; font-weight: 600; }
.p-bet { font-size: 12px; color: #fbbf24; margin-top: 2px; }
.dealer-chip { position: absolute; top: -10px; right: -10px; background: #fff; color: #000; font-weight: 900; font-size: 12px; width: 22px; height: 22px; line-height: 22px; border-radius: 50%; border: 2px solid #000; z-index: 3; }
.mini-cards { display: flex; justify-content: center; gap: 5px; margin-bottom: 5px; }
.mini-card { width: 40px; height: 56px; background: #fff; border-radius: 5px; font-size: 16px; font-weight: 800; line-height: 56px; box-shadow: 0 3px 6px rgba(0,0,0,0.6); }
.action-bar { position: fixed; bottom: 14px; right: 20px; display: flex; flex-direction: column; gap: 8px; background: rgba(25,25,25,0.95); padding: 12px 16px; border-radius: 8px; border: 1px solid #444; z-index: 20; min-width: 360px; }
.action-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.combo-pill { color: #facc15; font-size: 13px; font-weight: 700; }
.act-btn { padding: 8px 14px; border: none; border-radius: 5px; font-weight: 700; cursor: pointer; font-size: 13px; }
.btn-call { background: #16a34a; color: #fff; }
.btn-raise { background: #eab308; color: #000; }
.btn-fold { background: #dc2626; color: #fff; }
.raise-panel { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid #3a3735; padding-top: 8px; }
.preset-row { display: flex; align-items: center; gap: 6px; }
.preset-btn { background: #3a3735; color: #e5e5e5; border: 1px solid #555; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 700; cursor: pointer; flex: 1; }
.preset-btn:hover { background: #524e4b; color: #facc15; }
.raise-inp { width: 85px; padding: 5px 8px; border-radius: 4px; border: 1px solid #666; background: #18181b; color: #facc15; font-weight: 800; text-align: right; font-size: 13px; }
.bet-slider { width: 100%; accent-color: #eab308; cursor: pointer; height: 6px; }
.bottom-drawer { position: fixed; bottom: 0; left: 16px; width: 350px; background: #2c2a29; border: 1px solid #444; border-bottom: none; border-radius: 6px 6px 0 0; z-index: 10; }
.drawer-tabs { display: flex; border-bottom: 1px solid #444; }
.d-tab { flex: 1; padding: 7px; text-align: center; font-size: 12px; font-weight: 700; cursor: pointer; color: #aaa; }
.d-tab.active { color: #fff; background: #3a3735; }
.drawer-body { display: none; height: 150px; flex-direction: column; padding: 8px; }
.drawer-body.open { display: flex; }
.msg-list { flex: 1; overflow-y: auto; font-size: 12px; text-align: left; color: #d4d4d4; }
.chat-input-row { display: flex; gap: 5px; margin-top: 6px; }
.chat-input-row input { flex: 1; background: #1e1d1c; border: 1px solid #555; color: #fff; padding: 5px 8px; border-radius: 4px; font-size: 12px; }
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 50; justify-content: center; align-items: center; }
.brown-modal { background: #5c3d24; border: 2px solid #7c5332; border-radius: 6px; width: 480px; max-width: 92vw; padding: 20px; color: #f5efe6; box-shadow: 0 15px 40px rgba(0,0,0,0.8); position: relative; }
.brown-modal h2 { margin: 0 0 14px; text-align: center; font-size: 20px; }
.close-x { position: absolute; top: 12px; right: 14px; cursor: pointer; font-weight: bold; color: #d6c3b3; }
.hr-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; font-size: 14px; font-weight: 700; }
.hr-cards { display: flex; gap: 4px; }
.hr-c { width: 28px; height: 38px; background: #fff; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; line-height: 1.1; }
.hr-empty { width: 28px; height: 38px; border: 1px dashed #a88b73; border-radius: 4px; }
.lb-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 16px; }
.lb-table th { padding: 8px; border-bottom: 1px solid #7c5332; color: #e6d5c3; }
.lb-table td { padding: 8px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.08); }
.lb-me { background: rgba(255,255,255,0.12); font-weight: bold; }
.pos-green { color: #4ade80; font-weight: bold; }
.neg-red { color: #f87171; font-weight: bold; }
.brown-btn { background: #7c5332; color: #fff; border: 1px solid #9c6b43; padding: 9px 18px; border-radius: 4px; font-weight: 700; cursor: pointer; display: block; margin: 0 auto; }
.stack-row { display: flex; justify-content: space-between; align-items: center; margin: 12px 0; font-size: 14px; font-weight: 600; }
.stack-inp { background: #15803d; border: 1px solid #22c55e; color: #fff; padding: 7px 10px; border-radius: 4px; width: 120px; font-weight: bold; text-align: right; }
.buy-submit { width: 100%; background: #16a34a; color: #fff; border: none; padding: 11px; font-weight: 800; border-radius: 4px; cursor: pointer; margin-top: 12px; font-size: 14px; }
</style>
</head>
<body>
<div class="topbar">
  <div><div class="brand">LIPOKER</div><div class="blinds">Blinds: $1.25 / $2.50 | Keys: [C] Check/Call, [F] Fold</div></div>
  <div>
    <button class="top-btn" onclick="openModal('lbModal')">LEADERBOARD</button>
    <button class="top-btn" onclick="openModal('hrModal')">Hand Rankings</button>
    <button class="top-btn" id="startBtn" onclick="socket.emit('startHand')">START HAND</button>
  </div>
</div>

<div class="color-picker">
  <div class="swatch" style="background:#0d7a22;" onclick="setFelt('#0d7a22')"></div>
  <div class="swatch" style="background:#1d4ed8;" onclick="setFelt('#1d4ed8')"></div>
  <div class="swatch" style="background:#991b1b;" onclick="setFelt('#991b1b')"></div>
  <div class="swatch" style="background:#6b21a8;" onclick="setFelt('#6b21a8')"></div>
  <div class="swatch" style="background:#374151;" onclick="setFelt('#374151')"></div>
</div>

<div class="arena">
  <div class="felt" id="tableFelt">
    <div class="pot-tag">Pot: $<span id="potVal">0.00</span></div>
    <button class="copy-btn" id="copyLinkBtn" onclick="copyLink()">COPY GAME LINK</button>
    <div class="board-cards" id="boardCards"></div>
    <div id="statusBanner" style="color:#fde047; font-size:14px; font-weight:700; margin-top:8px;"></div>
  </div>
  <div class="seat s0" id="seat-0"></div><div class="seat s1" id="seat-1"></div>
  <div class="seat s2" id="seat-2"></div><div class="seat s3" id="seat-3"></div>
  <div class="seat s4" id="seat-4"></div><div class="seat s5" id="seat-5"></div>
  <div class="seat s6" id="seat-6"></div><div class="seat s7" id="seat-7"></div>
</div>

<div class="action-bar" id="actionBar" style="display:none;">
  <div class="action-top">
    <span class="combo-pill" id="myComboPill"></span>
    <div id="turnBtns" style="display:none; gap:6px;">
      <button class="act-btn btn-call" id="callBtn" onclick="act('call')">CHECK [C]</button>
      <button class="act-btn btn-raise" onclick="act('raise')">RAISE</button>
      <button class="act-btn btn-fold" onclick="act('fold')">FOLD [F]</button>
    </div>
  </div>
  <div class="raise-panel" id="raisePanel" style="display:none;">
    <div class="preset-row">
      <button class="preset-btn" onclick="setPotFraction(0.25)">1/4</button>
      <button class="preset-btn" onclick="setPotFraction(0.5)">1/2</button>
      <button class="preset-btn" onclick="setAllIn()">ALL-IN</button>
      <input type="number" class="raise-inp" id="raiseAmt" value="2.50" step="0.5" min="2.5" oninput="syncSliderFromInput()">
    </div>
    <input type="range" class="bet-slider" id="raiseSlider" min="2.5" max="100" step="0.5" value="2.5" oninput="syncInputFromSlider()">
  </div>
</div>

<div class="bottom-drawer">
  <div class="drawer-tabs">
    <div class="d-tab" id="tabChat" onclick="toggleDrawer('chat')">Chat</div>
    <div class="d-tab" id="tabLog" onclick="toggleDrawer('log')">Log</div>
  </div>
  <div class="drawer-body" id="bodyChat">
    <div class="msg-list" id="chatList"></div>
    <div class="chat-input-row">
      <input type="text" id="chatInp" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendChat()">
      <button class="top-btn" style="margin:0; padding:4px 10px;" onclick="sendChat()">Send</button>
    </div>
  </div>
  <div class="drawer-body" id="bodyLog"><div class="msg-list" id="logList"></div></div>
</div>

<div class="modal-bg" id="joinModal" onclick="if(event.target===this) closeModals()">
  <div class="brown-modal" style="width:340px;">
    <span class="close-x" onclick="closeModals()">X</span>
    <h2>Take a Seat</h2>
    <div class="stack-row"><span>Nickname:</span><input type="text" id="nickInp" class="stack-inp" style="background:#3c2817; border-color:#7c5332; text-align:left;" placeholder="Your name"></div>
    <button class="buy-submit" onclick="confirmSeat()">SIT DOWN ($100.00)</button>
  </div>
</div>

<div class="modal-bg" id="stackModal" onclick="if(event.target===this) closeModals()">
  <div class="brown-modal" style="width:400px;">
    <span class="close-x" onclick="closeModals()">X</span>
    <div class="stack-row"><span>Your current stack</span><span id="curStackTxt">$0.00</span></div>
    <div class="stack-row"><span>Buy more +</span><input type="number" id="addStackInp" class="stack-inp" value="0" min="0" oninput="calcNewStack()"></div>
    <div class="stack-row"><span>Subtract from stack -</span><input type="number" id="subStackInp" class="stack-inp" value="0" min="0" oninput="calcNewStack()"></div>
    <div class="stack-row"><span>Your new stack will be</span><span id="newStackTxt">$0.00</span></div>
    <button class="buy-submit" onclick="submitStack()">BUY MORE</button>
  </div>
</div>

<div class="modal-bg" id="lbModal" onclick="if(event.target===this) closeModals()">
  <div class="brown-modal">
    <span class="close-x" onclick="closeModals()">X</span>
    <h2>Leaderboard</h2>
    <table class="lb-table"><thead><tr><th>Player</th><th>Buy-in</th><th>Profit</th></tr></thead><tbody id="lbBody"></tbody></table>
    <button class="brown-btn" onclick="socket.emit('resetSession'); closeModals();">RESET SESSION</button>
  </div>
</div>

<div class="modal-bg" id="hrModal" onclick="if(event.target===this) closeModals()">
  <div class="brown-modal"><span class="close-x" onclick="closeModals()">X</span><h2>Hand Rankings</h2><div id="hrContainer"></div></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
var socket = io();
var suitIcons = { h: '&hearts;', d: '&diams;', c: '&clubs;', s: '&spades;' };
var selectedSeat = 0, myCards = [], myStack = 0, currentPot = 0, isMyTurn = false, activeDrawer = null;
var turnDeadline = 0, turnDuration = 30000;

var rankingsData = [
  ['1. Royal Flush', ['As','Ks','Qs','Js','Ts'], 0],
  ['2. Straight Flush', ['5c','4c','3c','2c','Ac'], 0],
  ['3. Four of a Kind', ['4c','4s','4d','4h'], 1],
  ['4. Full House', ['8c','8s','5d','5h','5c'], 0],
  ['5. Flush', ['9s','2s','4s','6s','As'], 0],
  ['6. Straight', ['9s','8d','7c','6h','5s'], 0],
  ['7. Three of a Kind', ['2s','2h','2d'], 2],
  ['8. Two Pair', ['9s','9d','Ks','Kc'], 1],
  ['9. One Pair', ['6s','6d'], 3],
  ['10. High Card', ['As'], 4]
];

document.getElementById('hrContainer').innerHTML = rankingsData.map(function(item) {
  var title = item.at(0), cards = item.at(1), empties = item.at(2);
  var cHtml = cards.map(function(c) {
    var v = c.at(0) === 'T' ? '10' : c.at(0), s = c.at(1), col = (s === 'h' || s === 'd') ? 'red' : 'black';
    return '<div class="hr-c ' + col + '"><span>' + v + '</span><span>' + suitIcons[s] + '</span></div>';
  }).join('');
  return '<div class="hr-row"><span>' + title + '</span><div class="hr-cards">' + cHtml + Array(empties).fill('<div class="hr-empty"></div>').join('') + '</div></div>';
}).join('');

function setFelt(color) { document.getElementById('tableFelt').style.background = color; }
function copyLink() {
  navigator.clipboard.writeText(window.location.href);
  var btn = document.getElementById('copyLinkBtn');
  btn.innerText = 'LINK COPIED!';
  setTimeout(function() { btn.innerText = 'COPY GAME LINK'; }, 2000);
}
function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModals() { document.querySelectorAll('.modal-bg').forEach(function(m) { m.style.display = 'none'; }); }
function openJoin(seat) { selectedSeat = seat; openModal('joinModal'); document.getElementById('nickInp').focus(); }
function confirmSeat() {
  var name = document.getElementById('nickInp').value.trim();
  if (!name) return;
  socket.emit('joinSeat', { name: name, seat: selectedSeat });
  closeModals();
}
function openStackModal() {
  document.getElementById('curStackTxt').innerText = '$' + myStack.toFixed(2);
  document.getElementById('addStackInp').value = 0;
  document.getElementById('subStackInp').value = 0;
  document.getElementById('newStackTxt').innerText = '$' + myStack.toFixed(2);
  openModal('stackModal');
}
function calcNewStack() {
  var add = Math.max(0, Number(document.getElementById('addStackInp').value) || 0);
  var sub = Math.max(0, Number(document.getElementById('subStackInp').value) || 0);
  document.getElementById('newStackTxt').innerText = '$' + Math.max(0, myStack + add - sub).toFixed(2);
}
function submitStack() {
  socket.emit('adjustStack', { addAmt: Number(document.getElementById('addStackInp').value) || 0, subAmt: Number(document.getElementById('subStackInp').value) || 0 });
  closeModals();
}
function toggleDrawer(tab) {
  var bC = document.getElementById('bodyChat'), bL = document.getElementById('bodyLog'), tC = document.getElementById('tabChat'), tL = document.getElementById('tabLog');
  if (activeDrawer === tab) { bC.classList.remove('open'); bL.classList.remove('open'); tC.classList.remove('active'); tL.classList.remove('active'); activeDrawer = null; }
  else { activeDrawer = tab; bC.classList.toggle('open', tab === 'chat'); bL.classList.toggle('open', tab === 'log'); tC.classList.toggle('active', tab === 'chat'); tL.classList.toggle('active', tab === 'log'); }
}
function sendChat() {
  var inp = document.getElementById('chatInp');
  if (inp.value.trim()) { socket.emit('chatMsg', inp.value); inp.value = ''; }
}
function setPotFraction(frac) {
  var val = Math.max(2.50, Math.min(myStack, Number((currentPot * frac).toFixed(2))));
  document.getElementById('raiseAmt').value = val.toFixed(2);
  document.getElementById('raiseSlider').value = val;
}
function setAllIn() {
  var val = Math.max(2.50, myStack);
  document.getElementById('raiseAmt').value = val.toFixed(2);
  document.getElementById('raiseSlider').value = val;
}
function syncInputFromSlider() {
  var val = Number(document.getElementById('raiseSlider').value);
  document.getElementById('raiseAmt').value = val.toFixed(2);
}
function syncSliderFromInput() {
  var val = Number(document.getElementById('raiseAmt').value) || 2.50;
  document.getElementById('raiseSlider').value = Math.min(myStack, Math.max(2.50, val));
}

document.addEventListener('keydown', function(e) {
  if (!isMyTurn) return;
  if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) return;
  var k = e.key.toLowerCase();
  if (k === 'c' || k === 'с') { act('call'); }
  else if (k === 'f' || k === 'а') { act('fold'); }
});

setInterval(function() {
  var activeWrap = document.getElementById('activeTimerWrap');
  if (!activeWrap || !turnDeadline) return;
  var rem = Math.max(0, turnDeadline - Date.now());
  var pct = Math.min(100, (rem / turnDuration) * 100);
  var deg = (pct / 100) * 360;
  var col = pct > 50 ? '#4ade80' : (pct > 25 ? '#facc15' : '#ef4444');
  activeWrap.style.background = 'conic-gradient(' + col + ' ' + deg + 'deg, #3a3735 0deg)';
}, 50);

function renderCard(c, mini) {
  var val = c.at(0) === 'T' ? '10' : c.at(0), suit = c.at(1), col = (suit === 'h' || suit === 'd') ? 'red' : 'black';
  return mini ? '<div class="mini-card ' + col + '">' + val + suitIcons[suit] + '</div>' : '<div class="card ' + col + '"><div>' + val + '</div><div>' + suitIcons[suit] + '</div></div>';
}
function act(type) { socket.emit('action', { type: type, amount: document.getElementById('raiseAmt').value }); }

socket.on('yourCards', function(cards) { myCards = cards; });
socket.on('yourCombo', function(combo) { document.getElementById('myComboPill').innerText = combo ? 'Hand: ' + combo : ''; });
socket.on('chatMessage', function(data) {
  var list = document.getElementById('chatList');
  list.innerHTML += '<div><b>' + data.sender + ':</b> ' + data.text + '</div>';
  list.scrollTop = list.scrollHeight;
});
socket.on('gameState', function(state) {
  currentPot = state.pot;
  turnDeadline = state.turnDeadline || 0;
  turnDuration = state.turnDuration || 30000;
  document.getElementById('potVal').innerText = state.pot.toFixed(2);
  document.getElementById('boardCards').innerHTML = state.communityCards.map(function(c) { return renderCard(c, false); }).join('');
  if (state.message) document.getElementById('statusBanner').innerText = state.message;
  if (state.logs) {
    var logList = document.getElementById('logList');
    logList.innerHTML = state.logs.map(function(l) { return '<div>- ' + l + '</div>'; }).join('');
    logList.scrollTop = logList.scrollHeight;
  }
  var me = state.players.find(function(p) { return p.id === socket.id; });
  myStack = me ? me.chips : 0;
  isMyTurn = Boolean(me && me.isTurn);

  for (var i = 0; i < 8; i++) {
    var el = document.getElementById('seat-' + i), p = state.players.find(function(x) { return x.seat === i; });
    if (!p) { el.innerHTML = me ? '' : '<button class="open-btn" onclick="openJoin(' + i + ')">OPEN</button>'; }
    else {
      var isMe = p.id === socket.id;
      var cardsHtml = '';
      if (isMe && myCards.length === 2 && state.stage !== 'WAITING') cardsHtml = '<div class="mini-cards">' + myCards.map(function(c) { return renderCard(c, true); }).join('') + '</div>';
      else if (p.revealedCards && p.revealedCards.length === 2) cardsHtml = '<div class="mini-cards">' + p.revealedCards.map(function(c) { return renderCard(c, true); }).join('') + '</div>';
      var wrapId = p.isTurn ? ' id="activeTimerWrap"' : '';
      el.innerHTML = cardsHtml + '<div' + wrapId + ' class="plate-wrap' + (p.isTurn ? ' turn' : '') + '"><div class="player-plate' + (p.folded ? ' folded' : '') + '" onclick="' + (isMe ? 'openStackModal()' : '') + '">' + (p.isDealer ? '<div class="dealer-chip">D</div>' : '') + '<div class="p-name">' + p.name + '</div><div class="p-stack">$' + p.chips.toFixed(2) + '</div>' + (p.bet > 0 ? '<div class="p-bet">Bet: $' + p.bet.toFixed(2) + '</div>' : '') + '</div></div>';
    }
  }
  document.getElementById('actionBar').style.display = me ? 'flex' : 'none';
  document.getElementById('turnBtns').style.display = isMyTurn ? 'flex' : 'none';
  document.getElementById('raisePanel').style.display = isMyTurn ? 'flex' : 'none';
  document.getElementById('startBtn').style.display = (state.stage === 'WAITING' && state.players.length >= 2) ? 'inline-block' : 'none';
  if (me) {
    var slider = document.getElementById('raiseSlider');
    slider.max = Math.max(2.50, myStack);
    if (Number(slider.value) > myStack) { slider.value = slider.max; syncInputFromSlider(); }
    var toCall = Number((state.currentBet - me.bet).toFixed(2));
    document.getElementById('callBtn').innerText = toCall > 0 ? 'CALL $' + toCall.toFixed(2) + ' [C]' : 'CHECK [C]';
  }
  var sorted = state.players.slice().sort(function(a, b) { return (b.chips - b.buyIn) - (a.chips - a.buyIn); });
  document.getElementById('lbBody').innerHTML = sorted.map(function(p, idx) {
    var profit = Number((p.chips - p.buyIn).toFixed(2));
    return '<tr class="' + (p.id === socket.id ? 'lb-me' : '') + '"><td>' + (idx + 1) + '. ' + p.name + '</td><td>$' + p.buyIn.toFixed(2) + '</td><td class="' + (profit >= 0 ? 'pos-green' : 'neg-red') + '">' + (profit >= 0 ? '+$' + profit.toFixed(2) : '-$' + Math.abs(profit).toFixed(2)) + '</td></tr>';
  }).join('');
});
</script>
</body>
</html>
