<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Покер с друзьями</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #143620; color: white; text-align: center; margin: 0; padding: 20px; }
        .table { background: #1e5631; border: 12px solid #4a2c11; border-radius: 150px; max-width: 800px; margin: 20px auto; padding: 40px 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        .card { display: inline-block; width: 55px; height: 80px; line-height: 80px; margin: 5px; background: white; border-radius: 8px; font-weight: bold; font-size: 24px; box-shadow: 2px 2px 8px rgba(0,0,0,0.4); }
        .red { color: #d90429; }
        .black { color: #111; }
        .players { display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; }
        .player-box { background: rgba(0,0,0,0.4); padding: 10px 18px; border-radius: 10px; border: 2px solid transparent; }
        .active-turn { border-color: #ffd700; box-shadow: 0 0 15px #ffd700; }
        .folded { opacity: 0.4; }
        .pot { font-size: 24px; color: #ffd700; font-weight: bold; margin: 15px 0; }
        button { padding: 10px 18px; font-size: 16px; cursor: pointer; margin: 5px; border: none; border-radius: 6px; font-weight: bold; }
        .btn-green { background: #2b9348; color: white; }
        .btn-red { background: #d90429; color: white; }
        .btn-gold { background: #ffb703; color: black; }
        input { padding: 10px; font-size: 16px; border-radius: 6px; border: none; width: 120px; }
    </style>
</head>
<body>
    <h1>♠️ Техасский Холдем ♥️</h1>
    <div id="login">
        <input type="text" id="nameInput" placeholder="Ваше имя" style="width: 200px;">
        <button class="btn-gold" onclick="join()">Сесть за стол</button>
    </div>

    <div id="game" style="display:none;">
        <div class="players" id="playersList"></div>

        <div class="table">
            <div id="stageText" style="color: #a3b18a; font-weight: bold;">Ожидание раздачи</div>
            <div class="pot">Банк: <span id="potAmount">0</span> 💰</div>
            <div id="communityCards" style="min-height: 95px;"></div>
            <h3 id="statusMsg" style="color: #ffd700;"></h3>
        </div>

        <h3>Ваши карты:</h3>
        <div id="myCards" style="min-height: 95px;"></div>

        <div id="controls" style="margin-top: 15px;">
            <button class="btn-gold" id="startBtn" onclick="socket.emit('startHand')">Начать раздачу</button>
            <span id="betControls" style="display:none;">
                <button class="btn-green" id="callBtn" onclick="act('call')">Чек / Колл</button>
                <input type="number" id="raiseInput" value="40" min="20" step="10">
                <button class="btn-gold" onclick="act('raise')">Рейз</button>
                <button class="btn-red" onclick="act('fold')">Пас (Fold)</button>
            </span>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const suitIcons = { h: '♥', d: '♦', c: '♣', s: '♠' };

        function formatCard(c) {
            const val = c.at(0) === 'T' ? '10' : c.at(0);
            const suit = c.at(1);
            const colorClass = (suit === 'h' || suit === 'd') ? 'red' : 'black';
            return `<div class="card ${colorClass}">${val}${suitIcons[suit]}</div>`;
        }

        function join() {
            const name = document.getElementById('nameInput').value.trim();
            if (!name) return;
            socket.emit('joinGame', name);
            document.getElementById('login').style.display = 'none';
            document.getElementById('game').style.display = 'block';
        }

        function act(type) {
            const amount = document.getElementById('raiseInput').value;
            socket.emit('action', { type, amount });
        }

        socket.on('yourCards', (cards) => {
            document.getElementById('myCards').innerHTML = cards.map(formatCard).join('');
        });

        socket.on('gameState', (state) => {
            document.getElementById('potAmount').innerText = state.pot;
            document.getElementById('stageText').innerText = 'Этап: ' + state.stage;
            document.getElementById('communityCards').innerHTML = state.communityCards.map(formatCard).join('');
            if (state.message) document.getElementById('statusMsg').innerText = state.message;

            const me = state.players.find(p => p.id === socket.id);
            const myTurn = me ? me.isTurn : false;
            const myBet = me ? me.bet : 0;

            document.getElementById('playersList').innerHTML = state.players.map(p => {
                return `<div class="player-box ${p.isTurn ? 'active-turn' : ''} ${p.folded ? 'folded' : ''}">
                    <div><b>${p.name}</b> ${p.isTurn ? '⏳' : ''}</div>
                    <div>Фишки: ${p.chips}</div>
                    <div>Ставка: ${p.bet}</div>
                </div>`;
            }).join('');

            document.getElementById('startBtn').style.display = state.stage === 'WAITING' ? 'inline-block' : 'none';
            document.getElementById('betControls').style.display = myTurn ? 'inline-block' : 'none';

            const toCall = state.currentBet - myBet;
            document.getElementById('callBtn').innerText = toCall > 0 ? `Колл (${toCall})` : 'Чек';
        });
    </script>
</body>
</html>
